server:
  port: 8080

spring:
  application:
    name: api-gateway
  config:
    import: "optional:file:.env[.properties]"
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
          routes:
            - id: loginApi
              uri: lb://login-service
              predicates:
                - Path=/api/auth/**, /api/usuarios/**

            - id: chamadoApi
              uri: lb://chamado-service
              predicates:
                - Path=/api/chamados/**

            - id: atendimentoApi
              uri: lb://atendimento-service
              predicates:
                - Path=/api/atendimento/**

            - id: relatorioApi
              uri: lb://relatorio-service
              predicates:
                - Path=/api/relatorio/**
    discovery:
      client:
        simple:
          instances:
            login-service:
              - uri: ${LOGIN_URL:http://localhost:8090}
            chamado-service:
              - uri: ${CHAMADO_URL:http://localhost:8091}
            atendimento-service:
              - uri: ${ATENDIMENTO_URL:http://localhost:8092}
            relatorio-service:
              - uri: ${RELATORIO_URL:http://localhost:8093}

jwt:
  secret: ${JWT_SECRET}

cookie:
  nome: ${COOKIE_NOME:tokenSuporteTi}

cors:
  origens:
    - "http://localhost:8081"
    - "http://localhost:19006"
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://127.0.0.1:8081"
    - "http://127.0.0.1:5500"