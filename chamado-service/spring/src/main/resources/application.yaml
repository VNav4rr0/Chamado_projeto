server:
  port: 8091

spring:
  application:
    name: chamado-service
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/chamadoDb?replicaSet=rs0}
  rabbitmq:
    addresses: ${CLOUDAMQP_URL:amqp://guest:guest@localhost:5672}
    publisher-confirm-type: correlated
    listener:
      simple:
        concurrency: 1
        max-concurrency: 1
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1000ms
          multiplier: 2.0
          max-interval: 5000ms
  data:
    mongodb:
      auto-index-creation: true
  config:
    import: "optional:file:.env[.properties],optional:file:../.env[.properties]"
