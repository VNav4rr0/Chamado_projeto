name: Build e Push - Login (Oracle GraalVM 21)

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
    paths:
      - "LOGIN/**"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "LOGIN/**"
  workflow_dispatch:

env:
  IMAGE_NAME: chamado-login

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Oracle GraalVM 21
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '21'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: Build do LOGIN com Maven
        run: mvn -B -f LOGIN/pom.xml clean package -DskipTests

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Gerar tags e labels da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build e Push da imagem
        uses: docker/build-push-action@v6
        with:
          context: ./LOGIN/spring
          file: ./LOGIN/spring/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max